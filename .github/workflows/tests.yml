name: Offline tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --no-editable
      - run: uv run --no-editable ruff check src tests
      - run: uv run --no-editable ruff format --check src tests
      - run: uv run --no-editable pytest -q
      - run: uv run --no-editable research-hub demo
  windows-deployment:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --no-editable
      - run: uv run --no-editable pytest -q tests/test_windows_scripts.py tests/test_supervisor.py tests/test_tunnel.py
