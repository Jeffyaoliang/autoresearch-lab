[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "autoresearch-hub"
version = "0.1.0"
description = "Research Hub: evidence projection, advisory delivery, and recoverable research workflows"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["mcp>=1.30,<2", "uvicorn>=0.54,<1"]

[project.optional-dependencies]
windows = ["pywinpty>=2; sys_platform == 'win32'"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx==0.28.1", "ruff>=0.9,<1", "jsonschema>=4.23,<5"]

[project.scripts]
research-hub = "research_hub.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/research_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
